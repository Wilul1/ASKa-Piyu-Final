# Sample nginx rate limits for ASKa-Piyu (BE-03).
# Include from your site config, e.g.:
#   include /path/to/aska-piyu/deploy/nginx-rate-limits.conf;

limit_req_zone $binary_remote_addr zone=aska_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aska_qa:10m rate=30r/m;

