# Local / lab HTTP proxy (rate limits). Tokens travel in cleartext on this path.
# Production campus deploy: use nginx.https.conf + docker-compose.https.yml.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=aska_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=aska_qa:10m rate=30r/m;

    upstream aska_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        include /etc/nginx/aska/nginx-proxy-locations.inc;
    }
}
