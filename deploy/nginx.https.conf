# Production TLS terminator for the ASKa-Piyu API.
# Place certs in deploy/certs/ (see deploy/certs/README.md), then:
#   docker compose --profile full -f docker-compose.yml -f docker-compose.https.yml up -d --build

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=aska_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=aska_qa:10m rate=30r/m;

    upstream aska_api {
        server api:8000;
    }

    # Force HTTPS so passwords/JWTs are not sent in cleartext.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern baseline; tighten further if your campus PKI requires it.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS: enable only after HTTPS works end-to-end for your hostname.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        include /etc/nginx/aska/nginx-proxy-locations.inc;
    }
}
