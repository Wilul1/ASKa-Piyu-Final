name: aska_piyu
description: ASKa-Piyu campus knowledge base, Ask assistant, and support tickets.
publish_to: 'none'
# Display version for Android/iOS/web builds (versionName + build number).
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/brandmark.png
    - assets/hero_waves.png
    - assets/lspu_logo.png
